name: ci

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Node syntax
        run: node --check index.js && node --check client.js

      - name: Python syntax
        run: python3 -m py_compile bridge/minimax_bridge.py bridge/h3_api.py

      - name: CLI help
        run: |
          python3 bridge/minimax_bridge.py --help >/dev/null
          python3 bridge/h3_api.py --help >/dev/null
